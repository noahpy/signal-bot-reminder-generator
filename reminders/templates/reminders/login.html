{% extends "reminders/base.html" %}
{% block content %}
<article style="max-width:420px;margin:2rem auto;">
    <header><strong>Login</strong><br><small>with your Schollheim account (LDAP)</small></header>
    {% if form.errors %}<p class="msg error">Wrong username or password.</p>{% endif %}
    <form method="post">{% csrf_token %}
        <input type="hidden" name="next" value="{{ next }}">
        <label>Username <input name="username" autofocus required autocomplete="username"></label>
        <label>Password <input type="password" name="password" required autocomplete="current-password"></label>
        <button type="submit">Login</button>
    </form>
</article>
{% endblock %}
