{% extends "reminders/base.html" %}
{% load i18n %}
{% block content %}
<article style="max-width:420px;margin:2rem auto;">
    <header><strong>{% translate "Login" %}</strong><br><small>{% translate "with your Schollheim account (LDAP)" %}</small></header>
    {% if form.errors %}<p class="msg error">{% translate "Wrong username or password." %}</p>{% endif %}
    <form method="post">{% csrf_token %}
        <input type="hidden" name="next" value="{{ next }}">
        <label>{% translate "Username" %} <input name="username" autofocus required autocomplete="username"></label>
        <label>{% translate "Password" %} <input type="password" name="password" required autocomplete="current-password"></label>
        <button type="submit">{% translate "Login" %}</button>
    </form>
</article>
{% endblock %}
